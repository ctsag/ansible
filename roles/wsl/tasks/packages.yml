- name: Update and upgrade apt
  ctsag_ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: full

- name: Install terminator
  ctsag_ansible.builtin.apt:
    name: terminator
    state: present

- name: Install ctsag_ansible-lint
  ctsag_ansible.builtin.apt:
    name: ctsag_ansible-lint
    state: present

- name: Install pip
  ctsag_ansible.builtin.apt:
    name: python3-pip
    state: present

- name: Install venv
  ctsag_ansible.builtin.apt:
    name: python3-venv
    state: present

- name: Install python3 as python
  ctsag_ansible.builtin.apt:
    name: python-is-python3
    state: present

- name: Install pycodestyle
  ctsag_ansible.builtin.apt:
    name: pycodestyle
    state: present

- name: Install pylint
  ctsag_ansible.builtin.apt:
    name: pylint
    state: present

- name: Install colordiff
  ctsag_ansible.builtin.apt:
    name: colordiff
    state: present

- name: Install meld
  ctsag_ansible.builtin.apt:
    name: meld
    state: present

- name: Install NFS
  ctsag_ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Install sqlite
  ctsag_ansible.builtin.apt:
    name: sqlite3
    state: present
