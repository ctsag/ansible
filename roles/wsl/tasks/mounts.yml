- name: Mount C drive
  ctsag_.posix.mount:
    src: '{{ wsl_parent_host }}:/c/'
    path: '{{ wsl_mount_dir }}'
    fstype: nfs
    opts: 'nfsvers=3,nolock'
    state: mounted

- name: Gather deprecated mount points
  ctsag_.builtin.find:
    paths: /mnt
    file_type: directory
    depth: 1
  register: found_dirs

- name: Remove deprecated mount points
  ctsag_.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ found_dirs.files }}'
  when: item.path | basename != 'c'
